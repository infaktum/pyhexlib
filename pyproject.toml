# File: `pyproject.toml`
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhexlib"
dynamic = ["version"]
description = "A Python library for creating hex grid games with pygame."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Heiko Sippel", email = "heiko.sippel@gmail.com" }]
dependencies = ["pygame-ce>=2.5.7"]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]

keywords = ["pygame", "hex", "hexgrid"]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://infaktum.github.io/pyhexlib/"
Repository = "https://github.com/infaktum/pyhexlib"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyhexlib*", "pylightgui*"]

[tool.setuptools.dynamic]
version = {attr = "pyhexlib.__version__"}

[tool.setuptools.package-data]
pyhexlib = ["fonts/*.ttf"]

[project.scripts]
epub = "pyhexlib.__main__:main"

